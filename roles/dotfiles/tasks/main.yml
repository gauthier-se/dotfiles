---
- name: Ensure target directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .config
    - .local/bin
    - .zsh

- name: Symlink config directories
  ansible.builtin.file:
    src: "{{ configs_dir }}/{{ item.pkg }}/.config/{{ item.target | default(item.pkg) }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/{{ item.target | default(item.pkg) }}"
    state: link
    force: true
  loop:
    - { pkg: aerospace }
    - { pkg: dunst }
    - { pkg: ghostty }
    - { pkg: gtk, target: gtk-3.0 }
    - { pkg: gtk, target: gtk-4.0 }
    - { pkg: hypr }
    - { pkg: lazydocker }
    - { pkg: lazygit }
    - { pkg: nvim }
    - { pkg: qt, target: Kvantum }
    - { pkg: qt, target: qt5ct }
    - { pkg: qt, target: qt6ct }
    - { pkg: tmux }
    - { pkg: tmux, target: tmuxinator }
    - { pkg: waybar }
    - { pkg: wofi }
    - { pkg: yazi }

- name: Symlink root and miscellaneous dotfiles
  ansible.builtin.file:
    src: "{{ configs_dir }}/{{ item.pkg }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { pkg: zsh, src: .zshrc, dest: .zshrc }
    - { pkg: zsh, src: .zsh_aliases, dest: .zsh_aliases }
    - { pkg: zsh, src: .zsh_functions, dest: .zsh_functions }
    - { pkg: git, src: .gitconfig, dest: .gitconfig }
    - { pkg: git, src: catppuccin.gitconfig, dest: catppuccin.gitconfig }
    - { pkg: tmux, src: .local/bin/tmux-sessionizer.sh, dest: .local/bin/tmux-sessionizer.sh }
