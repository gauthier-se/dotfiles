# Hyprland — mirrors the aerospace.toml bindings (hjkl, workspaces, Moonfly borders)

# 2160x1440 panel: 1.5 scale = 1440x960 logical, comfortable and sharp
monitor = , preferred, auto, 1.5

# Session (waybar/mako/swaybg come from home.packages)
exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/dotfiles/wallpapers/wallpaper.jpg -m fill

input {
    kb_layout = fr
    kb_options = caps:escape
    repeat_rate = 40
    repeat_delay = 250
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    # Same gaps as aerospace; thinner borders than the Mac's 7px jankyborders
    gaps_in = 6
    gaps_out = 3
    border_size = 2
    col.active_border = rgb(626262)
    col.inactive_border = rgb(262626)
    layout = dwindle
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

dwindle {
    preserve_split = true
}

# --- Bindings (Super instead of Alt: Alt stays free for terminal apps) ---

$mod = SUPER

# Launchers
bind = $mod, Space, exec, fuzzel
bind = $mod, X, exec, alacritty
bind = $mod, B, exec, brave

# Windows
bind = $mod, F, fullscreen
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, F, togglefloating

# Focus / move (hjkl)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Resize
binde = $mod, code:20, resizeactive, -25 0
binde = $mod, code:21, resizeactive, 25 0

# Workspaces — key codes 10-19 = number row, works on AZERTY without Shift
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod, code:19, workspace, 10

bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod SHIFT, code:19, movetoworkspace, 10

bind = $mod, Tab, workspace, previous

# Screenshot (region -> clipboard)
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Media & brightness keys
bindel = , XF86AudioRaiseVolume, exec, pamixer --allow-boost --set-limit 150 -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer --allow-boost --set-limit 150 -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# Reload
bind = $mod SHIFT, R, exec, hyprctl reload
