################
### MONITORS ###
################

monitor = , preferred, auto, auto


###################
### MY PROGRAMS ###
###################

$terminal    = ghostty
$fileManager = dolphin
$browser     = brave
$menu        = wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = awww-daemon & sleep 1 && awww img $HOME/dotfiles/wallpapers/wallpaper.jpg
exec-once = dunst
exec-once = wl-clip-persist --clipboard regular


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

# Wayland native apps
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_STYLE_OVERRIDE, kvantum
env = GDK_BACKEND, wayland
env = XDG_SESSION_TYPE, wayland

# Dark mode
env = GTK_THEME, Adwaita:dark
env = XCURSOR_THEME, Adwaita


##############
### COLORS ###
##############

# Catppuccin Mocha
$base     = 0xff1e1e2e
$mantle   = 0xff181825
$crust    = 0xff11111b
$text     = 0xffcdd6f4
$lavender = 0xffb4befe
$blue     = 0xff89b4fa
$sapphire = 0xff74c7ec
$mauve    = 0xffcba6f7
$green    = 0xffa6e3a1
$red      = 0xfff38ba8
$surface0 = 0xff313244
$surface1 = 0xff45475a
$overlay0 = 0xff6c7086
$flamingo = 0xfff2cdcd
$peach    = 0xfffab387


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 4
    gaps_out = 8

    border_size = 3

    col.active_border   = $peach $flamingo 45deg
    col.inactive_border = $surface0

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 8
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled      = true
        range        = 8
        render_power = 3
        color        = 0x66000000
    }

    blur {
        enabled    = true
        size       = 6
        passes     = 3
        vibrancy   = 0.2
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,  default
    animation = border,        1, 5,   easeOutQuint
    animation = windows,       1, 4,   easeOutQuint
    animation = windowsIn,     1, 4,   easeOutQuint, popin 87%
    animation = windowsOut,    1, 2,   linear,       popin 87%
    animation = fade,          1, 3,   quick
    animation = layers,        1, 4,   easeOutQuint
    animation = workspaces,    1, 3,   almostLinear, fade
}

dwindle {
    # pseudotile = true is removed in >= v0.55
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}


#############
### INPUT ###
#############

input {
    kb_layout  = fr
    kb_variant =
    kb_model   =
    kb_options = caps:escape
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
    }
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = $mainMod,       X,      exec, $terminal
bind = $mainMod,       B,      exec, $browser
bind = $mainMod,       Space,  exec, $menu
bind = $mainMod,       E,      exec, $fileManager

# Window management
bind = $mainMod,       Q,      killactive
bind = $mainMod,       F,      fullscreen, 0
bind = $mainMod,       V,      togglefloating
bind = $mainMod,       P,      pseudo       # dwindle pseudotile
bind = $mainMod SHIFT, Space,  layoutmsg, togglesplit  # dwindle

# Move focus — vim style
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Move windows — vim style
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Resize windows
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, J, resizeactive, 0 40
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, L, resizeactive, 40 0

# Arrow keys fallback
bind = $mainMod, left,  movefocus, l
bind = $mainMod, down,  movefocus, d
bind = $mainMod, up,    movefocus, u
bind = $mainMod, right, movefocus, r

# Workspaces — AZERTY row (no Shift needed)
# Physical keys: & é " ' ( - è _ ç à
bind = $mainMod, ampersand,   workspace, 1
bind = $mainMod, eacute,      workspace, 2
bind = $mainMod, quotedbl,    workspace, 3
bind = $mainMod, apostrophe,  workspace, 4
bind = $mainMod, parenleft,   workspace, 5
bind = $mainMod, minus,       workspace, 6
bind = $mainMod, egrave,      workspace, 7
bind = $mainMod, underscore,  workspace, 8
bind = $mainMod, ccedilla,    workspace, 9
bind = $mainMod, agrave,      workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, ampersand,   movetoworkspace, 1
bind = $mainMod SHIFT, eacute,      movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl,    movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe,  movetoworkspace, 4
bind = $mainMod SHIFT, parenleft,   movetoworkspace, 5
bind = $mainMod SHIFT, minus,       movetoworkspace, 6
bind = $mainMod SHIFT, egrave,      movetoworkspace, 7
bind = $mainMod SHIFT, underscore,  movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla,    movetoworkspace, 9
bind = $mainMod SHIFT, agrave,      movetoworkspace, 10

# Cycle workspaces
bind = $mainMod, TAB,       workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1

# Scratchpad
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# Screenshots → fichier + presse-papier + notif (requires grim, slurp, wl-copy, libnotify, jq)
$screenshotDir = $HOME/Pictures/Screenshots
$screenshotName = screenshot-$(date +%Y%m%d-%H%M%S).png

# Plein écran
bind = , Print, exec, mkdir -p $screenshotDir && grim - | tee $screenshotDir/$screenshotName | wl-copy && notify-send -t 2000 "Screenshot" "Plein écran"

# Zone à sélectionner (drag avec slurp)
bind = SHIFT, Print, exec, mkdir -p $screenshotDir && grim -g "$(slurp)" - | tee $screenshotDir/$screenshotName | wl-copy && notify-send -t 2000 "Screenshot" "Zone copiée"

# Fenêtre active uniquement
bind = CTRL, Print, exec, mkdir -p $screenshotDir && grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | tee $screenshotDir/$screenshotName | wl-copy && notify-send -t 2000 "Screenshot" "Fenêtre copiée"

# Screen lock (requires hyprlock)
bind = $mainMod, backspace, exec, hyprlock

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media & system keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Brightness — F1/F2, keyboard backlight — F3
bindel = , F1, exec, brightnessctl -e4 -n2 set 5%-
bindel = , F2, exec, brightnessctl -e4 -n2 set 5%+
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name  = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name  = float-file-dialogs
    match:class = ^(xdg-desktop-portal|polkit-gnome-authentication-agent).*
    float = true
    center = true
}

windowrule {
    name  = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}
