# ~/.config/tmuxinator/checkpoint.yml

name: checkpoint
root: ~/Repos/Java/Checkpoint

windows:
  - nvim:
      panes:
        - |
          nvim .

  - infra:
      panes:
        - |
          startdocker
          cd api
          docker compose up -d
          lazydocker

  - api:
      panes:
        - |
          cd api
          doppler run -- ./mvnw spring-boot:run

  - web:
      panes:
        - |
          cd web
          pnpm dev

  - desktop:
      panes:
        - |
          cd desktop

  - git:
      panes:
        - |
          lazygit

  - zsh:
      panes:
        - |
          fastfetch
