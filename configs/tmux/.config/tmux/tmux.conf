set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Forward terminal focus events to the pane (nvim needs it to :checktime on FocusGained)
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename off
set -g status-left-length 30

# Rebind vertical split to 3 since " is used for window 3
bind 3 split-window -v

# AZERTY keyboard bindings for window navigation
bind & select-window -t 1
bind é select-window -t 2
bind '"' select-window -t 3
bind "'" select-window -t 4
bind ( select-window -t 5
bind § select-window -t 6 # Mac AZERTY
bind - select-window -t 6 # PC AZERTY
bind è select-window -t 7
bind ! select-window -t 8 # Mac AZERTY
bind _ select-window -t 8 # PC AZERTY
bind ç select-window -t 9
bind à select-window -t 10

# Color fix
set-option -sa terminal-overrides ",xterm*:Tc"

# Theme colors: moonfly by default, then whatever the `theme` script selected.
# Style options use -F so re-sourcing this file picks up new colors.
source-file ~/.config/tmux/themes/moonfly.conf
source-file -q ~/.local/state/theme/tmux.conf

set -gF status-style "fg=#{@thm_muted},bg=default"

# Left side of status bar
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#{@thm_accent}#,bg=#{@thm_bg}#,bold],#[fg=#{@thm_bg}#,bg=#{@thm_accent}#,bold]} #S #{?client_prefix,#[fg=#{@thm_bg}#,bg=#{@thm_surface}#,nobold],#[fg=#{@thm_accent}#,bg=#{@thm_surface}#,nobold]}#[fg=#{@thm_muted},bg=#{@thm_surface},bold] #(whoami) #{?client_prefix,#[bg=#{@thm_accent}#,fg=#{@thm_surface}],#[fg=#{@thm_surface}#,bg=#{@thm_bg}]}#{?client_prefix,#[fg=#{@thm_bg}#,bg=#{@thm_accent}],#[fg=#{@thm_accent}#,bg=#{@thm_bg}#,bold]} #I:#P #{?client_prefix,#[fg=#{@thm_accent}#,bg=default],#[fg=#{@thm_bg}#,bg=default#,nobold]}"

# Window status (middle)
set -g window-status-format "#[fg=#{@thm_muted}]#[bg=default]  #I:#W#F  "
set -g window-status-current-format "#[fg=#{@thm_bg},bg=default]#[fg=#{@thm_accent},bold,bg=#{@thm_bg}] #I:#W#F #[fg=#{@thm_bg},bg=default,nobold]"

# Right side of status bar
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#{@thm_accent}#,bg=default],#[fg=#{@thm_bg}#,bg=default]}#{?client_prefix,#[fg=#{@thm_bg}#,bg=#{@thm_accent}#,bold],#[fg=#{@thm_accent}#,bg=#{@thm_bg},bold]} %l:%M %p #{?client_prefix,#[bg=#{@thm_accent}#,fg=#{@thm_surface}],#[fg=#{@thm_surface}#,bg=#{@thm_bg}]}#[fg=#{@thm_muted},bg=#{@thm_surface}] %d-%m-%y #{?client_prefix,#[fg=#{@thm_bg}#,bg=#{@thm_surface}#,nobold],#[fg=#{@thm_accent}#,bg=#{@thm_surface}#,nobold]}#{?client_prefix,#[fg=#{@thm_accent}#,bg=#{@thm_bg}#,bold],#[fg=#{@thm_bg}#,bg=#{@thm_accent}#,bold]} #H "

# Window separator
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane border
set -gF pane-border-style "bg=default,fg=#{@thm_border}"
set -gF pane-active-border-style "bg=default,fg=#{@thm_accent}"

# Messages
set -gF message-style "bg=#{@thm_surface},fg=#{@thm_muted}"
set -gF message-command-style "bg=#{@thm_surface},fg=#{@thm_muted}"
set -gF mode-style "bg=#{@thm_bg},fg=#{@thm_accent}"

set-option -g status-position bottom

# Vi mode for copying
set-window-option -g mode-keys vi

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer.sh"
