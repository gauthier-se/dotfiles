# Alacritty: font carried over from the ghostty config

# Colors: moonfly by default, then whatever the `theme` script selected
# (missing imports are skipped, e.g. before the first `theme` run)
[general]
import = [
  "~/dotfiles/configs/alacritty/.config/alacritty/themes/moonfly.toml",
  "~/.local/state/theme/alacritty.toml",
]

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"

[window]
startup_mode = "Maximized"
decorations = "Buttonless"
padding = { x = 0, y = 0 }

[cursor.style]
shape = "Beam"
blinking = "On"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
