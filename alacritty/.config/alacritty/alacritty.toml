[window]
opacity = 0.85
padding = { x = 5, y = 5 }
decorations = "None"
startup_mode = "Maximized"
dynamic_title = true

[font]
normal      = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 10.0

[cursor]
style = { shape = "Beam", blinking = "Always" }

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[colors.primary]
background = "#1b1f2e"
foreground = "#cdd6f4"

[colors.cursor]
text   = "#1b1f2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text   = "#1b1f2e"
cursor = "#b4befe"

[colors.selection]
text       = "#1b1f2e"
background = "#b4befe"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[[keyboard.bindings]]
key   = "Return"
mods  = "Shift"
chars = "\u001b\r"

[[keyboard.bindings]]
key    = "V"
mods   = "Control"
action = "Paste"
