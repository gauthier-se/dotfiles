# Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable image preview passthrough (for Yazi)
set -g allow-passthrough on

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g automatic-rename off
set -g status-left-length 30

# Opens panes in current directory (v and b for splits, 3 as fallback for ")
bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"
bind 3 split-window -v -c "#{pane_current_path}"

# AZERTY keyboard bindings for window navigation
bind & select-window -t 1
bind é select-window -t 2
bind '"' select-window -t 3
bind "'" select-window -t 4
bind ( select-window -t 5
bind § select-window -t 6 # Mac AZERTY
bind - select-window -t 6 # PC AZERTY
bind è select-window -t 7
bind ! select-window -t 8 # Mac AZERTY
bind _ select-window -t 8 # PC AZERTY
bind ç select-window -t 9
bind à select-window -t 10

# Color fix
set-option -sa terminal-overrides ",xterm*:Tc"

# Navigation configuration (Prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + H, J, K, L (hold Shift)
# The -r flag allows repeating the key without pressing the prefix again
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Yanking
set -g @plugin 'tmux-plugins/tmux-yank'
# Vi mode for copying
set-window-option -g mode-keys vi
# Shortcut to select (v) and copy (y) like in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer.sh"
