# ~/.config/tmuxinator/checkpoint.yml

name: checkpoint
root: ~/Repos/Java/Checkpoint

windows:
  - claude:
      panes:
        - |
          claude

  - nvim:
      panes:
        - |
          nvim .

  - infrastructure:
      panes:
        - |
          startdocker 
          cd api
          docker compose up -d
          lazydocker

  - backend:
      panes:
        - |
          cd api
          doppler run -- ./mvnw spring-boot:run

  - frontend:
      panes:
        - |
          cd web
          pnpm dev

  - lazygit:
      panes:
        - |
          lazygit

  - zsh:
      panes:
        - |
          fastfetch
