[manager]
prepend_keymap = [
    # Navigation
    { on = [ "g", "h" ], run = "cd ~", desc = "Go to ~" },
    { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to ~/.config" },
    { on = [ "g", "D" ], run = "cd ~/Downloads", desc = "Go to ~/Downloads" },
    { on = [ "g", "d" ], run = "cd ~/dotfiles", desc = "Go to ~/dotfiles" },
    { on = [ "g", "r" ], run = "cd ~/Repos", desc = "Go to ~/Repos" },

    # Vim-like half-page jumps
    { on = [ "<C-u>" ], run = "seek -5", desc = "Seek up 5 units in the preview" },
    { on = [ "<C-d>" ], run = "seek 5", desc = "Seek down 5 units in the preview" },

    # Integration with FZF / Zoxide (if you plan to use Yazi's official plugins, otherwise we can map bash equivalents)
    # Ex: { on = [ "Z" ], run = "plugin zoxide", desc = "Jump to a directory using zoxide" },

    # Quick open terminal/editor
    { on = [ "E" ], run = "open --env EDITOR", desc = "Open with default editor" },

    # Selection
    { on = [ "V" ], run = "visual_mode", desc = "Enter visual mode (selection)" },
]
