[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_dir_first = true
sort_reverse   = false
sort_sensitive = false
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 1000
max_height      = 1000
image_quality   = 90
# Yazi automatically detects kitty protocol for image previews used by Ghostty!

[opener]
edit = [
    { run = '${EDITOR:-vi} "$@"', desc = "Edit", block = true, for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "Open", for = "macos" },
]
reveal = [
    { run = 'open -R "$1"', desc = "Reveal", for = "macos" },
]

[open]
rules = [
    { url = "*.toml", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml", use = "edit" },
    { url = "*.json", use = "edit" },
    { mime = "text/*", use = "edit" },
    { mime = "image/*", use = "open" },
    { mime = "video/*", use = "open" },
    { mime = "audio/*", use = "open" },
    { mime = "inode/directory", use = "open" },
    # Fallback
    { mime = "*", use = "open" },
]
